name: e2e-inter-ctrl-spiffe-mtls

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  e2e-inter-ctrl-spiffe-mtls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      - name: Setup Kubernetes
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.32.0
          cluster_name: flux-e2e-inter-ctrl-spiffe-mtls
          wait: 5s
      - name: Setup Kustomize
        uses: fluxcd/pkg/actions/kustomize@fc29ca0375323410da6588eb84a304444943f898 # main
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Build flux CLI
        run: make build-dev
      - name: Run SPIFFE e2e tests
        run: CLUSTER=flux-e2e-inter-ctrl-spiffe-mtls ./tests/inter-ctrl-spiffe-mtls/run.sh
      - name: Debug failure
        if: failure()
        run: |
          kubectl -n spire-system get all
          kubectl -n flux-system get all
          kubectl -n flux-system get events --sort-by=.lastTimestamp | tail -100
          for dep in source-controller source-watcher kustomize-controller helm-controller notification-controller image-reflector-controller image-automation-controller; do
            echo "--- $dep ---"
            kubectl -n flux-system logs deploy/$dep --tail=120
          done
          kubectl -n flux-system logs deploy/event-sink --tail=120
