name: test-gh-action

on:
  pull_request:
    paths:
      - 'action/**'
  push:
    paths:
      - 'action/**'
    branches:
      - 'main'
      - 'release/**'

permissions: read-all

jobs:
  actions:
    strategy:
      fail-fast: false
      matrix:
        version: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.version }}
    name: action on ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup flux
        uses: ./action

  version-file:
    runs-on: ubuntu-latest
    name: action version-file on ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup flux from a plain version file
        uses: ./action
        with:
          version-file: action/testdata/.flux-version
      - name: Assert plain version file
        shell: bash
        run: |
          set -euo pipefail
          flux -v
          flux -v | grep -q '2.8.8'
      - name: Setup flux from a .tool-versions file
        uses: ./action
        with:
          version-file: action/testdata/.tool-versions
      - name: Assert .tool-versions file
        shell: bash
        run: |
          set -euo pipefail
          flux -v
          flux -v | grep -q '2.9.2'

  plugins:
    runs-on: ubuntu-latest
    name: action plugins on ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build flux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cmd/flux/manifests "$RUNNER_TEMP/flux-bin"
          printf "apiVersion: v1\nkind: List\nitems: []\n" > cmd/flux/manifests/dummy.yaml
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.VERSION=0.0.0-pr" -o "$RUNNER_TEMP/flux-bin/flux" ./cmd/flux
      - name: Setup flux with plugin
        id: setup
        uses: ./action
        with:
          version: 0.0.0-pr
          bindir: ${{ runner.temp }}/flux-bin
          plugins: |
            mirror@sha256:91a1e04c2015ee66b1633e362cdb6d4550891b91bf3391a83414b9e9912e53f1
      - name: Assert plugin installation
        shell: bash
        env:
          ACTION_PLUGIN_DIR: ${{ steps.setup.outputs['plugin-dir'] }}
        run: |
          set -euo pipefail
          test -n "${FLUXCD_PLUGINS:-}"
          test "$ACTION_PLUGIN_DIR" = "$FLUXCD_PLUGINS"
          test -x "$FLUXCD_PLUGINS/flux-mirror"
          flux plugin list
          flux mirror --help
