apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/fluxcd/source-watcher/releases/download/v2.3.1/source-watcher.crds.yaml
- https://github.com/fluxcd/source-watcher/releases/download/v2.3.1/source-watcher.deployment.yaml
- account.yaml
transformers:
- labels.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: source-watcher
  path: patch.yaml
- target:
    version: v1
    kind: Service
    name: source-watcher
  patch: |-
    - op: add
      path: /spec/ports/-
      value:
        name: https
        port: 443
        protocol: TCP
        targetPort: http
