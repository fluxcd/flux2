apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/fluxcd/notification-controller/releases/download/v1.10.0/notification-controller.crds.yaml
- https://github.com/fluxcd/notification-controller/releases/download/v1.10.0/notification-controller.deployment.yaml
- account.yaml
transformers:
- labels.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: notification-controller
    path: patch.yaml
  - target:
      version: v1
      kind: Service
      name: notification-controller
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: https
          port: 443
          protocol: TCP
          targetPort: http
  - target:
      version: v1
      kind: Service
      name: webhook-receiver
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: https
          port: 443
          protocol: TCP
          targetPort: http-webhook
