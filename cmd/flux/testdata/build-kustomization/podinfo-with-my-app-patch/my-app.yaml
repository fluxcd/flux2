---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: my-app
spec:
  interval: 5m0s
  path: ./my-app
  force: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: podinfo
  targetNamespace: default
  patches:
  - target:
      kind: ConfigMap
      name: my-app
    patch: |
      - op: replace
        path: /data/var
        value: patched
