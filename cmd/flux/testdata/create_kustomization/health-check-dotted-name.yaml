---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: my-app
  namespace: flux-system
spec:
  healthChecks:
  - kind: Deployment
    name: my.app
    namespace: default
  interval: 1m0s
  path: ./deploy
  prune: false
  sourceRef:
    kind: GitRepository
    name: repo
  timeout: 2m0s
