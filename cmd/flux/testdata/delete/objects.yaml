---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .fluxns }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-a
  namespace: {{ .fluxns }}
spec:
  path: ./apps/a/
  sourceRef:
    kind: GitRepository
    name: repo
  interval: 5m
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-b
  namespace: {{ .fluxns }}
spec:
  path: ./apps/b/
  sourceRef:
    kind: GitRepository
    name: repo
  interval: 5m
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-c
  namespace: {{ .fluxns }}
spec:
  path: ./apps/c/
  sourceRef:
    kind: GitRepository
    name: repo
  interval: 5m
  prune: true
