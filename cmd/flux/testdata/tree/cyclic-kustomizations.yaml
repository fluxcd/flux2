---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .fluxns }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cycle-a
  namespace: {{ .fluxns }}
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 5m
  prune: true
status:
  inventory:
    entries:
      - id: {{ .fluxns }}_cycle-b_kustomize.toolkit.fluxcd.io_Kustomization
        v: v1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cycle-b
  namespace: {{ .fluxns }}
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 5m
  prune: true
status:
  inventory:
    entries:
      - id: {{ .fluxns }}_cycle-a_kustomize.toolkit.fluxcd.io_Kustomization
        v: v1
      - id: {{ .fluxns }}_config__ConfigMap
        v: v1
