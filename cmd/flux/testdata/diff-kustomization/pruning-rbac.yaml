apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pruning
  namespace: {{ .fluxns }}
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pruning
  namespace: {{ .fluxns }}
subjects:
  - kind: User
    name: pruning
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pruning
  apiGroup: rbac.authorization.k8s.io
