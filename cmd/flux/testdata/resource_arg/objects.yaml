---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
  namespace: {{ .ns }}
spec:
  interval: 5m
  url: https://stefanprodan.github.io/podinfo
status:
  artifact:
    lastUpdateTime: "2021-08-01T04:28:42Z"
    revision: sha256:9f3bc0f341d4ecf2bab460cc59320a2a9ea292f01d7b96e32740a9abfd341088
