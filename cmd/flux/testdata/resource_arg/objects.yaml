      reason: Succeeded
      status: "True"
      type: Ready
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: {{ .ns }}
spec:
  interval: 5m
  path: ./kustomize
  prune: true
  sourceRef:
    kind: GitRepository
    name: podinfo
status:
  lastAppliedRevision: main@sha1:696f056df216eea4f9401adbee0ff744d4df390f
  conditions:
    - lastTransitionTime: "2021-08-01T04:52:56Z"
      message: 'Applied revision: main@sha1:696f056df216eea4f9401adbee0ff744d4df390f'
      reason: ReconciliationSucceeded
      status: "True"
      type: Ready
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: podinfo
  namespace: {{ .ns }}
spec:
  interval: 5m
  image: ghcr.io/stefanprodan/podinfo
status:
  lastScanResult:
    tagCount: 3
    scanTime: "2021-08-01T04:28:42Z"
  conditions:
    - lastTransitionTime: "2021-07-20T00:48:16Z"
      message: 'successful scan: found 3 tags'
      reason: Succeeded
      status: "True"
      type: Ready
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: podinfo
  namespace: {{ .ns }}
spec:
  imageRepositoryRef:
    name: podinfo
  policy:
    semver:
      range: 6.x
status:
  latestRef:
    name: ghcr.io/stefanprodan/podinfo
    tag: 6.0.0
  conditions:
    - lastTransitionTime: "2021-07-20T00:48:16Z"
      message: 'Latest image tag for ghcr.io/stefanprodan/podinfo resolved to 6.0.0'
      reason: Succeeded
      status: "True"
      type: Ready
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: slack
  namespace: {{ .ns }}
spec:
  address: https://hooks.slack.com/services/mock
  channel: alerts
  type: slack
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: podinfo
  namespace: {{ .ns }}
spec:
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
  providerRef:
    name: slack
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: {{ .ns }}
spec:
  interval: 5m
  ref:
    branch: main
  url: https://github.com/fluxcd/flux2
