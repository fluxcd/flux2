---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .fluxns }}
---
apiVersion: v1
kind: Secret
metadata:
  name: git-auth
  namespace: {{ .fluxns }}
type: Opaque
data:
  password: cGFzc3dvcmQ=
---
apiVersion: v1
kind: Secret
metadata:
  name: oci-auth
  namespace: {{ .fluxns }}
type: Opaque
data:
  token: dG9rZW4=
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app-a
  namespace: {{ .fluxns }}
spec:
  url: https://github.com/stefanprodan/podinfo
  ref:
    branch: main
  secretRef:
    name: git-auth
  interval: 5m
