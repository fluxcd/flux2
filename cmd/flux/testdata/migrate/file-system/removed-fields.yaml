apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: alert
  labels:
    summary: keep
spec:
  # summary is deprecated
  summary: "Cluster: prod"
  providerRef:
    name: slack
  eventMetadata:
    summary: keep
  eventSources:
    - kind: Kustomization
      name: '*'
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: slack
spec:
  type: slack
  interval: 5m
  proxy: http://proxy.example.com:8080
  secretRef:
    name: slack-url
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: multiline
spec:
    providerRef:
      name: slack
    summary: |
      Line one.

      Line two.
    eventSources:
      - kind: HelmRelease
        name: '*'
---
apiVersion: v1
kind: List
items:
  - apiVersion: notification.toolkit.fluxcd.io/v1beta3
    kind: Provider
    metadata:
      name: in-list
    spec:
      type: generic
      proxy:
        http://proxy.example.com:8080
  - apiVersion: notification.toolkit.fluxcd.io/v1beta3
    kind: Alert
    metadata:
      name: in-list
    spec:
      providerRef:
        name: in-list
      eventSources:
        - kind: GitRepository
          name: '*'
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: templated
spec:
  type: {{ .Values.type }}
{{- if .Values.proxy }}
  proxy: {{ .Values.proxy }}
{{- end }}
  address: https://example.com
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: already-v1
spec:
  type: slack
  proxy: http://untouched
