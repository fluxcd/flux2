apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-sink
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-sink
  template:
    metadata:
      labels:
        app: event-sink
    spec:
      containers:
        - name: event-sink
          image: ghcr.io/stefanprodan/podinfo:6.16.0
          command: [./podinfo, --port=8080, --level=debug]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: event-sink
  namespace: flux-system
spec:
  selector:
    app: event-sink
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: event-sink
  namespace: flux-system
spec:
  type: generic
  address: http://event-sink.flux-system.svc.cluster.local/api/echo
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: event-sink
  namespace: flux-system
spec:
  providerRef:
    name: event-sink
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: Bucket
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: HelmChart
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: ImageRepository
      name: "*"
    - kind: ImagePolicy
      name: "*"
    - kind: ImageUpdateAutomation
      name: "*"
    - kind: ArtifactGenerator
      name: "*"
    - kind: ExternalArtifact
      name: "*"
